extends = "base.toml"

# Near-full rehearsal. It introduces 64x64 maps and warehouse geometry, uses
# two independent seeds, and exercises all evaluation corpora at up to 32 agents.
[training]
target_environment_steps = 10000000
replay_capacity = 1500000
replay_checkpoint_size = 20000
epsilon_decay_steps = 7500000
per_beta_steps = 7500000
num_actors = 12
checkpoint_interval_steps = 100000
validation_interval_episodes = 500
validation_episodes = 100

[curriculum]
[[curriculum.stages]]
name = "preflight-random-32-10-2"
map_path = "maps/random-32-32-10.map"
num_agents = 2
max_episode_steps = 200
min_episodes = 2500
max_episodes = 20000
graduation_success_rate = 0.90

[[curriculum.stages]]
name = "preflight-random-32-10-4"
map_path = "maps/random-32-32-10.map"
num_agents = 4
max_episode_steps = 200
min_episodes = 2500
max_episodes = 20000
graduation_success_rate = 0.85

[[curriculum.stages]]
name = "preflight-random-32-20-8"
map_path = "maps/random-32-32-20.map"
num_agents = 8
max_episode_steps = 200
min_episodes = 3000
max_episodes = 25000
graduation_success_rate = 0.75

[[curriculum.stages]]
name = "preflight-maze-32-8"
map_path = "maps/maze-32-32-4.map"
num_agents = 8
max_episode_steps = 300
min_episodes = 3000
max_episodes = 25000
graduation_success_rate = 0.65

[[curriculum.stages]]
name = "preflight-room-32-8"
map_path = "maps/room-32-32-4.map"
num_agents = 8
max_episode_steps = 300
min_episodes = 3000
max_episodes = 25000
graduation_success_rate = 0.75

[[curriculum.stages]]
name = "preflight-random-64-10-8"
map_path = "maps/random-64-64-10.map"
num_agents = 8
max_episode_steps = 400
min_episodes = 3000
max_episodes = 25000
graduation_success_rate = 0.75

[[curriculum.stages]]
name = "preflight-random-64-20-12"
map_path = "maps/random-64-64-20.map"
num_agents = 12
max_episode_steps = 400
min_episodes = 4000
max_episodes = 30000
graduation_success_rate = 0.65

[[curriculum.stages]]
name = "preflight-room-64-12"
map_path = "maps/room-64-64-8.map"
num_agents = 12
max_episode_steps = 500
min_episodes = 4000
max_episodes = 30000
graduation_success_rate = 0.65

[[curriculum.stages]]
name = "preflight-warehouse-12"
map_path = "maps/warehouse-10-20-10-2-1.map"
num_agents = 12
max_episode_steps = 1000
min_episodes = 4000
max_episodes = 30000
graduation_success_rate = 0.60

[evaluation]
agent_counts = [4, 8, 16, 32]
scenario_directories = [
  "scens/scen-random-32-32-10",
  "scens/room-32-32-4",
  "scens/warehouse-10-20-10-2-1",
]
training_seeds = [42, 43]
bootstrap_samples = 2000
save_step_telemetry = true
failure_trace_limit = 50
